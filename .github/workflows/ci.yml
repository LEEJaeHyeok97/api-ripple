name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 컴파일·포맷·정적 분석은 JDK 21에서, 테스트는 JDK 17/21 런타임에서 돌린다 (docs/decisions.md).
    name: build (tests on JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 마지막 버전(21)이 JAVA_HOME이 되어 Gradle을 실행한다.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (test, Spotless, Error Prone, NullAway, JaCoCo)
        run: >
          ./gradlew build
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.test-java }}
          path: "**/build/reports/"
