name: release

# v<semver> 태그를 푸시하면 테스트를 다시 돌리고, CLI 단일 jar를 GitHub Release에 첨부한다.
# Gradle Plugin Portal 배포(./gradlew :gradle-plugin:publishPlugins)는 사람이 결정한다 (docs/releasing.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./gradlew build :cli:fatJar
          -PreleaseVersion="$VERSION"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # "## [x.y.z]" 섹션을 뽑는다. 없으면 빈 노트로 두고 GitHub 자동 노트를 쓴다.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          wc -l release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jar="cli/build/libs/config-guard-${VERSION}-all.jar"
          test -f "$jar"
          if [[ -s release-notes.md ]]; then
            gh release create "$TAG" "$jar" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$jar" --title "$TAG" --generate-notes
          fi
