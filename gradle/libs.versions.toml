# 모든 의존성·도구 버전은 이 파일에서만 관리한다 (명세 6.12).

[versions]
java-toolchain = "21"   # 컴파일·린트에 쓰는 JDK
java-release = "17"     # 바이트코드 타깃 (Spring Boot 3 최소 요구 버전)
junit = "5.14.4"
assertj = "3.27.7"
jspecify = "1.0.1"
errorprone = "2.52.0"
nullaway = "0.14.3"
google-java-format = "1.36.1"  # 1.37.0은 Spotless 8.11에서 실패 (docs/decisions.md)
jacoco = "0.8.14"
snakeyaml = "2.7"
javaparser = "3.28.2"
jackson = "2.23.0"
picocli = "4.7.7"
plugin-publish = "2.1.1"
# samples/demo 전용
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
spotless-plugin = "8.11.0"
errorprone-plugin = "5.1.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
javaparser-symbol-solver = { module = "com.github.javaparser:javaparser-symbol-solver-core", version.ref = "javaparser" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# build-logic(컨벤션 플러그인)에서 쓰는 Gradle 플러그인 아티팩트
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

[plugins]
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
# samples/demo가 이 카탈로그를 공유한다.
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
